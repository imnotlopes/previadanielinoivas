    <!--
      APRESENTAÇÃO DE NOIVAS

      HTML próprio, e não uma rota de aplicação de página única, por um motivo
      só: o robô que monta o cartão do WhatsApp NÃO EXECUTA JAVASCRIPT. Com uma
      SPA, os três links devolveriam o mesmo cartão, e a madrinha receberia o
      preview de noiva.

      As três capas precisam ser diferentes. O cartão é a primeira impressão,
      antes de a página abrir.

      `noindex, nofollow`: isto é material de conversa comercial, não conteúdo
      de busca. O link chega pronto pela Danielli.
    -->
    <title data-seo-estatico>Vestidos de noiva | Danielli Noivas</title>
    <meta data-seo-estatico name="description" content="Alguns dos modelos do ateliê, com prova com hora marcada, ajuste incluso e a data do seu casamento reservada." />
