<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#242321" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!--
      PEÇA 1 — APRESENTAÇÃO NOIVA

      Este arquivo existe separado das outras peças por um motivo só: o CARTÃO
      DO WHATSAPP. Quando a Danielli cola o link na conversa, o robô do
      WhatsApp lê as tags abaixo para montar a prévia — e ele NÃO EXECUTA
      JAVASCRIPT. Numa aplicação de página única os três links devolveriam o
      mesmo HTML e o mesmo cartão; a noiva e a formanda receberiam previews
      idênticos.

      Ao mexer aqui, mexa também em catalogo.html e festa.html: os três textos
      precisam continuar DIFERENTES entre si, senão o motivo de existirem
      separados se perde.

      TODO: trocar as URLs absolutas ao apontar para o domínio real, e
      acrescentar a cidade quando `brand.cidade` for preenchida — estas tags
      são texto fixo e não acompanham a constante.
    -->
    <title data-seo-estatico>Danielli Noivas | Vestidos de noiva para alugar</title>
    <meta
      data-seo-estatico
      name="description"
      content="Vestidos de noiva para alugar. Prova com hora marcada e sem compromisso, ajuste incluso e a data do seu casamento reservada."
    />

    <meta data-seo-estatico property="og:type" content="website" />
    <meta data-seo-estatico property="og:site_name" content="Atelier Danielli Noivas" />
    <meta data-seo-estatico property="og:locale" content="pt_BR" />
    <meta data-seo-estatico property="og:title" content="Danielli Noivas | Vestidos de noiva" />
    <meta
      data-seo-estatico
      property="og:description"
      content="A noiva vem pra escolher o vestido, e o vestido acaba escolhendo ela. Prova sem compromisso e ajuste incluso."
    />
    <meta data-seo-estatico property="og:url" content="https://previadanielinoivas.vercel.app/" />
    <meta data-seo-estatico property="og:image" content="https://previadanielinoivas.vercel.app/og-noiva.jpg" />
    <meta data-seo-estatico property="og:image:width" content="1200" />
    <meta data-seo-estatico property="og:image:height" content="630" />
    <meta data-seo-estatico property="og:image:alt" content="Noiva de vestido rendado com véu, no Atelier Danielli Noivas" />

    <meta data-seo-estatico name="twitter:card" content="summary_large_image" />
    <meta data-seo-estatico name="twitter:title" content="Danielli Noivas | Vestidos de noiva" />
    <meta
      data-seo-estatico
      name="twitter:description"
      content="A noiva vem pra escolher o vestido, e o vestido acaba escolhendo ela."
    />
    <meta data-seo-estatico name="twitter:image" content="https://previadanielinoivas.vercel.app/og-noiva.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap"
      rel="stylesheet"
    />
