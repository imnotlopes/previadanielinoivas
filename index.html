<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#242321" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <title data-seo-estatico>Danielli Noivas | Aluguel de vestidos de noiva e festa</title>
    <meta
      data-seo-estatico
      name="description"
      content="Aluguel de vestidos de noiva, de festa e de 15 anos. Prova com hora marcada e sem compromisso, ajuste incluso no aluguel e reserva garantida para a data do seu evento."
    />

    <!--
      Open Graph ESTÁTICO.
      Os robôs de preview do WhatsApp, Facebook e Instagram não executam
      JavaScript, então leem apenas o que está aqui — as tags por rota do
      componente <Seo> não chegam neles. Ao trocar de domínio, atualize as
      URLs absolutas abaixo E a constante SITE_URL em src/lib/brand.ts.

      TODO: quando a cidade da loja for definida (brand.cidade), acrescente-a
      ao título e à descrição daqui também. Estas tags são texto fixo e não
      acompanham a constante como o resto do site.
    -->
    <meta data-seo-estatico property="og:type" content="website" />
    <meta data-seo-estatico property="og:site_name" content="Atelier Danielli Noivas" />
    <meta data-seo-estatico property="og:locale" content="pt_BR" />
    <meta data-seo-estatico property="og:title" content="Danielli Noivas | Aluguel de vestidos de noiva e festa" />
    <meta
      data-seo-estatico
      property="og:description"
      content="Vestidos de noiva, festa e 15 anos para alugar. Prove sem compromisso, reserve a data e leve o vestido ajustado no seu corpo."
    />
    <meta data-seo-estatico property="og:url" content="https://danielli-noivas.vercel.app/" />
    <meta data-seo-estatico property="og:image" content="https://danielli-noivas.vercel.app/og-image.jpg" />
    <meta data-seo-estatico property="og:image:width" content="1200" />
    <meta data-seo-estatico property="og:image:height" content="630" />
    <meta data-seo-estatico property="og:image:alt" content="Noiva de vestido rendado com véu, no Atelier Danielli Noivas" />

    <meta data-seo-estatico name="twitter:card" content="summary_large_image" />
    <meta data-seo-estatico name="twitter:title" content="Danielli Noivas | Aluguel de vestidos de noiva e festa" />
    <meta
      data-seo-estatico
      name="twitter:description"
      content="Vestidos de noiva, festa e 15 anos para alugar. Prove sem compromisso, reserve a data e leve o vestido ajustado no seu corpo."
    />
    <meta data-seo-estatico name="twitter:image" content="https://danielli-noivas.vercel.app/og-image.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
